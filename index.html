<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Alpha AI — Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020408;
  --surface: #080d14;
  --card: #0d1520;
  --border: #1a2a40;
  --accent: #00d4ff;
  --accent2: #7b2fff;
  --glow: rgba(0,212,255,0.4);
  --glow2: rgba(123,47,255,0.4);
  --text: #e0f0ff;
  --muted: #4a6a8a;
}
 
* { box-sizing: border-box; margin: 0; padding: 0; }
 
body {
  font-family: 'Exo 2', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}
 
/* ── Stars background ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 50% 80%, rgba(255,255,255,0.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 10% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.2) 0%, transparent 100%),
    radial-gradient(600px at 30% 20%, rgba(0,212,255,0.04) 0%, transparent 70%),
    radial-gradient(600px at 70% 80%, rgba(123,47,255,0.04) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
 
/* ── Header ── */
header {
  width: 100%; padding: 20px 40px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(8,13,20,0.8);
  backdrop-filter: blur(20px);
  position: sticky; top: 0; z-index: 100;
}
 
.logo {
  font-family: 'Orbitron', monospace;
  font-size: 1.2rem; font-weight: 900;
  letter-spacing: 0.1em;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
 
.status-dot {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.78rem; color: var(--muted);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 8px #00ff88; animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
 
/* ── Main ── */
main {
  flex: 1; width: 100%; max-width: 860px;
  padding: 40px 20px 100px;
  display: flex; flex-direction: column; align-items: center;
  gap: 32px; position: relative; z-index: 1;
}
 
/* ── Title ── */
.title-wrap { text-align: center; }
.title-wrap h1 {
  font-family: 'Orbitron', monospace;
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 900; letter-spacing: 0.05em;
  background: linear-gradient(135deg, var(--accent) 0%, #fff 50%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}
.title-wrap p { color: var(--muted); font-size: 0.95rem; font-weight: 300; }
 
/* ── Orb ── */
.orb-section { position: relative; width: 220px; height: 220px; }
 
.orb {
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%,
    #00eeff 0%, #0088cc 30%, #003366 65%, #000a1a 100%);
  box-shadow:
    0 0 40px var(--glow),
    0 0 80px rgba(0,212,255,0.15),
    inset 0 0 40px rgba(255,255,255,0.05);
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  transition: all 0.3s ease;
  cursor: pointer;
}
 
.orb.listening {
  animation: orb-listen 1s ease-in-out infinite;
  box-shadow: 0 0 60px var(--glow), 0 0 120px rgba(0,212,255,0.3), inset 0 0 40px rgba(255,255,255,0.1);
}
.orb.speaking {
  animation: orb-speak 0.5s ease-in-out infinite;
  background: radial-gradient(circle at 35% 35%, #ff88ff 0%, #7b2fff 30%, #330066 65%, #050010 100%);
  box-shadow: 0 0 60px var(--glow2), 0 0 120px rgba(123,47,255,0.3);
}
.orb.thinking {
  animation: orb-think 2s linear infinite;
}
 
@keyframes orb-listen {
  0%,100%{ transform: translate(-50%,-50%) scale(1); }
  50%{ transform: translate(-50%,-50%) scale(1.08); }
}
@keyframes orb-speak {
  0%,100%{ transform: translate(-50%,-50%) scale(1); }
  25%{ transform: translate(-50%,-50%) scale(1.05); }
  75%{ transform: translate(-50%,-50%) scale(0.97); }
}
@keyframes orb-think {
  from{ filter: hue-rotate(0deg); }
  to{ filter: hue-rotate(360deg); }
}
 
/* Rings around orb */
.ring {
  position: absolute; border-radius: 50%;
  border: 1px solid rgba(0,212,255,0.2);
  top: 50%; left: 50%; transform: translate(-50%,-50%);
  animation: ring-expand 3s ease-out infinite;
}
.ring:nth-child(1){ width: 220px; height: 220px; animation-delay: 0s; }
.ring:nth-child(2){ width: 260px; height: 260px; animation-delay: 1s; }
.ring:nth-child(3){ width: 300px; height: 300px; animation-delay: 2s; }
 
@keyframes ring-expand {
  0%{ opacity: 0.6; transform: translate(-50%,-50%) scale(0.9); }
  100%{ opacity: 0; transform: translate(-50%,-50%) scale(1.1); }
}
 
/* ── Status text ── */
.status-text {
  font-family: 'Orbitron', monospace;
  font-size: 0.85rem; letter-spacing: 0.15em;
  color: var(--accent); text-align: center;
  min-height: 24px;
  text-transform: uppercase;
}
 
/* ── Mic button ── */
.mic-btn {
  width: 80px; height: 80px; border-radius: 50%;
  border: 2px solid var(--accent);
  background: rgba(0,212,255,0.08);
  color: var(--accent); font-size: 28px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.25s ease;
  box-shadow: 0 0 20px rgba(0,212,255,0.2);
  position: relative;
}
.mic-btn:hover {
  background: rgba(0,212,255,0.15);
  box-shadow: 0 0 40px rgba(0,212,255,0.4);
  transform: scale(1.05);
}
.mic-btn.active {
  background: rgba(255,50,50,0.15);
  border-color: #ff4444;
  color: #ff4444;
  box-shadow: 0 0 40px rgba(255,68,68,0.5);
  animation: mic-pulse 1s ease-in-out infinite;
}
@keyframes mic-pulse {
  0%,100%{ box-shadow: 0 0 20px rgba(255,68,68,0.4); }
  50%{ box-shadow: 0 0 50px rgba(255,68,68,0.7); }
}
 
/* ── Chat messages ── */
.chat-wrap {
  width: 100%;
  display: flex; flex-direction: column; gap: 16px;
  max-height: 380px; overflow-y: auto;
  padding: 4px 4px 4px 4px;
}
.chat-wrap::-webkit-scrollbar{ width: 4px; }
.chat-wrap::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 2px; }
 
.msg {
  display: flex; gap: 12px; align-items: flex-start;
  animation: msg-in 0.3s ease;
}
@keyframes msg-in {
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}
.msg.user{ flex-direction: row-reverse; }
 
.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.msg.user .msg-avatar{ background: rgba(0,212,255,0.15); border: 1px solid var(--accent); color: var(--accent); }
.msg.ai .msg-avatar{ background: rgba(123,47,255,0.15); border: 1px solid var(--accent2); color: var(--accent2); }
 
.msg-bubble {
  max-width: 75%; padding: 12px 16px; border-radius: 16px;
  font-size: 0.9rem; line-height: 1.6; font-weight: 300;
}
.msg.user .msg-bubble{
  background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2);
  border-radius: 16px 4px 16px 16px; color: var(--text);
}
.msg.ai .msg-bubble{
  background: rgba(123,47,255,0.1); border: 1px solid rgba(123,47,255,0.2);
  border-radius: 4px 16px 16px 16px; color: var(--text);
}
 
/* Typing indicator */
.typing { display: flex; gap: 4px; padding: 14px 18px; }
.typing span {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent2);
  animation: typing-dot 1.2s ease-in-out infinite;
}
.typing span:nth-child(2){ animation-delay: 0.2s; }
.typing span:nth-child(3){ animation-delay: 0.4s; }
@keyframes typing-dot {
  0%,80%,100%{ transform: scale(0.6); opacity: 0.4; }
  40%{ transform: scale(1); opacity: 1; }
}
 
/* ── Text input ── */
.input-row {
  width: 100%; display: flex; gap: 10px; align-items: center;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 50px; padding: 8px 8px 8px 20px;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}
.input-row input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-family: 'Exo 2', sans-serif;
  font-size: 0.9rem; font-weight: 300;
}
.input-row input::placeholder { color: var(--muted); }
.send-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: none; background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease; flex-shrink: 0;
}
.send-btn:hover{ transform: scale(1.08); box-shadow: 0 0 20px var(--glow); }
 
/* ── Lang badge ── */
.lang-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px;
  background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2);
  font-size: 0.75rem; color: var(--accent); letter-spacing: 0.05em;
}
 
/* ── Controls row ── */
.controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
 
/* ── Waveform ── */
.waveform {
  display: flex; align-items: center; gap: 3px;
  height: 40px; opacity: 0; transition: opacity 0.3s;
}
.waveform.active{ opacity: 1; }
.wave-bar {
  width: 3px; border-radius: 3px;
  background: linear-gradient(to top, var(--accent2), var(--accent));
  animation: wave-anim 0.8s ease-in-out infinite;
}
.wave-bar:nth-child(1){ height: 8px;  animation-delay: 0s; }
.wave-bar:nth-child(2){ height: 20px; animation-delay: 0.1s; }
.wave-bar:nth-child(3){ height: 32px; animation-delay: 0.2s; }
.wave-bar:nth-child(4){ height: 20px; animation-delay: 0.3s; }
.wave-bar:nth-child(5){ height: 36px; animation-delay: 0.15s; }
.wave-bar:nth-child(6){ height: 14px; animation-delay: 0.25s; }
.wave-bar:nth-child(7){ height: 28px; animation-delay: 0.05s; }
@keyframes wave-anim {
  0%,100%{ transform: scaleY(0.5); }
  50%{ transform: scaleY(1); }
}
 
/* ── Scrollbar ── */
::-webkit-scrollbar{ width: 4px; }
::-webkit-scrollbar-track{ background: var(--bg); }
::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 2px; }
 
@media(max-width:600px){
  header{ padding: 14px 20px; }
  .orb-section{ width: 180px; height: 180px; }
  .orb{ width: 160px; height: 160px; }
}
</style>
</head>
<body>
 
<!-- HEADER -->
<header>
  <div class="logo">⬡ ALPHA AI</div>
  <div class="status-dot">
    <div class="dot"></div>
    <span>Online</span>
  </div>
</header>
 
<!-- MAIN -->
<main>
 
  <!-- Title -->
  <div class="title-wrap">
    <h1>ALPHA AI</h1>
    <p>Voice + Text Assistant — Hindi & English</p>
  </div>
 
  <!-- Orb -->
  <div class="orb-section">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="orb" id="orb" onclick="toggleMic()"></div>
  </div>
 
  <!-- Status -->
  <div class="status-text" id="statusText">Tap mic to speak</div>
 
  <!-- Controls -->
  <div class="controls">
    <div class="waveform" id="waveform">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
 
    <button class="mic-btn" id="micBtn" onclick="toggleMic()">
      🎙️
    </button>
 
    <div class="lang-badge">🇮🇳 HI + EN</div>
  </div>
 
  <!-- Chat messages -->
  <div class="chat-wrap" id="chatWrap">
    <div class="msg ai">
      <div class="msg-avatar">⬡</div>
      <div class="msg-bubble">
        Namaste! Main Alpha AI hoon. 🙏<br>
        Aap mujhse kuch bhi pooch sakte hain — Hindi ya English mein.<br>
        Mic button dabao ya neeche type karo!
      </div>
    </div>
  </div>
 
  <!-- Text input -->
  <div class="input-row">
    <input type="text" id="textInput" placeholder="Type karo ya mic use karo..." onkeydown="if(event.key==='Enter') sendText()" />
    <button class="send-btn" onclick="sendText()">➤</button>
  </div>
 
</main>
 
<!-- ═══════════════════════════════════
     SCRIPT
═══════════════════════════════════ -->
<script>
// ══════════════════════════════════════
// 🔧 REPLACE WITH YOUR CLAUDE API KEY
const const GEMINI_API_KEY = 'AIzaSy-tumhari-key-yahan';
// ══════════════════════════════════════
 
const SYSTEM_PROMPT = `Tu Alpha AI hai — ek smart, friendly voice assistant.
- Agar user English mein baat kare toh English mein reply kar  
- Agar dono mix kare (Hinglish) toh Hinglish mein reply kar
- Short aur clear answers de — 2-4 sentences max jab tak detail na manga jaye
- Friendly aur helpful tone rakho
- Emojis thode se use karo`;
 
let isListening = false;
let isSpeaking = false;
let recognition = null;
let synth = window.speechSynthesis;
let conversationHistory = [];
 
// ── Setup Speech Recognition ──────────
function setupRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    setStatus('Voice not supported — type instead');
    document.getElementById('micBtn').style.opacity = '0.4';
    return null;
  }
 
  const rec = new SpeechRecognition();
  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = 'hi-IN'; // Hindi primary — also picks up English
 
  rec.onstart = () => {
    isListening = true;
    setStatus('Listening...');
    setOrbState('listening');
    document.getElementById('micBtn').classList.add('active');
    document.getElementById('waveform').classList.add('active');
  };
 
  rec.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    stopListening();
    processInput(transcript);
  };
 
  rec.onerror = (e) => {
    stopListening();
    if (e.error !== 'no-speech') setStatus('Try again — mic error');
  };
 
  rec.onend = () => {
    if (isListening) stopListening();
  };
 
  return rec;
}
 
function toggleMic() {
  if (isSpeaking) { synth.cancel(); isSpeaking = false; }
  if (isListening) { stopListening(); return; }
  startListening();
}
 
function startListening() {
  if (!recognition) recognition = setupRecognition();
  if (!recognition) return;
  try { recognition.start(); } catch(e) { recognition = setupRecognition(); recognition?.start(); }
}
 
function stopListening() {
  isListening = false;
  recognition?.stop();
  document.getElementById('micBtn').classList.remove('active');
  document.getElementById('waveform').classList.remove('active');
  setOrbState('idle');
  setStatus('Tap mic to speak');
}
 
// ── Send text input ────────────────────
function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  processInput(text);
}
 
// ── Process Input → Claude API ─────────
async function processInput(text) {
  addMessage('user', text);
  setStatus('Thinking...');
  setOrbState('thinking');
 
  // Add to history
  conversationHistory.push({ role: 'user', content: text });
 
  // Show typing indicator
  const typingId = showTyping();
 
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': CLAUDE_API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });
 
    const data = await response.json();
    removeTyping(typingId);
 
    if (data.content && data.content[0]) {
      const reply = data.content[0].text;
      conversationHistory.push({ role: 'assistant', content: reply });
      addMessage('ai', reply);
      speakText(reply);
    } else {
      throw new Error('No response');
    }
 
  } catch (err) {
    removeTyping(typingId);
    const errMsg = 'Kuch error hua. API key check karo ya dobara try karo. 🙏';
    addMessage('ai', errMsg);
    setOrbState('idle');
    setStatus('Tap mic to speak');
    console.error(err);
  }
}
 
// ── Speak reply ────────────────────────
function speakText(text) {
  if (!synth) return;
  synth.cancel();
 
  // Clean text for speech (remove emojis)
  const cleanText = text.replace(/[\u{1F300}-\u{1FFFF}]/gu, '').trim();
 
  const utterance = new SpeechSynthesisUtterance(cleanText);
 
  // Detect language
  const hindiChars = /[\u0900-\u097F]/;
  utterance.lang = hindiChars.test(text) ? 'hi-IN' : 'en-IN';
  utterance.rate = 0.92;
  utterance.pitch = 1.05;
  utterance.volume = 1;
 
  utterance.onstart = () => {
    isSpeaking = true;
    setOrbState('speaking');
    setStatus('Speaking...');
  };
 
  utterance.onend = () => {
    isSpeaking = false;
    setOrbState('idle');
    setStatus('Tap mic to speak');
  };
 
  synth.speak(utterance);
}
 
// ── UI Helpers ─────────────────────────
function addMessage(role, text) {
  const wrap = document.getElementById('chatWrap');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? '👤' : '⬡'}</div>
    <div class="msg-bubble">${text.replace(/\n/g,'<br>')}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}
 
function showTyping() {
  const wrap = document.getElementById('chatWrap');
  const id = 'typing-' + Date.now();
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = id;
  div.innerHTML = `<div class="msg-avatar">⬡</div>
    <div class="msg-bubble"><div class="typing">
      <span></span><span></span><span></span>
    </div></div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return id;
}
 
function removeTyping(id) {
  document.getElementById(id)?.remove();
}
 
function setStatus(text) {
  document.getElementById('statusText').textContent = text;
}
 
function setOrbState(state) {
  const orb = document.getElementById('orb');
  orb.className = 'orb' + (state !== 'idle' ? ` ${state}` : '');
}
 
// ── Init ───────────────────────────────
recognition = setupRecognition();
</script>
</body>
</html>
